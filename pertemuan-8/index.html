<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linktree DEMO - </title>
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="rio.jpeg"/>
    <!-- Preconnect untuk performa Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts: Elms sans -->
    <link
    href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"/>
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css"/>
  </head>
  <body>
    <div class="container">
      <!-- 1. Header -->
      <header>
        <img src="rio.jpeg" alt="Logo" class="logo-img" />
      </header>

      <!-- 2. Body -->
      <main>
        <img src="rio.jpeg" alt="Foto Profil" class="profile-img" />
        <h1 class="title">Rio Rizky</h1>
        <p class="subtitle">Santri pondok teknologi</p>

        <div class="links-container">
          <a href="https://github.com" target="_blank" class="link-btn"
            >GitHub</a
          >
          <a href="https://linkedin.com" target="_blank" class="link-btn"
            >LinkedIn</a
          >
          <a href="https://instagram.com" target="_blank" class="link-btn"
            >Instagram</a
          >
          <a href="https://twitter.com" target="_blank" class="link-btn"
            >Twitter / X</a
          >
          <a href="mailto:email@example.com" class="link-btn"
            >Contact via Email</a
          >
        </div>
      </main>

      <!-- 3. Footer -->
      <footer>&copy; 2026 Rio Rizky. All rights reserved.</footer>
    </div>
  </body>
</html>
